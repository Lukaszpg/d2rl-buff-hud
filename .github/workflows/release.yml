name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: buff-hud-release
  cancel-in-progress: false

jobs:
  release:
    name: Version, pack, build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Bump canonical version
        id: version
        shell: pwsh
        run: |
          $current = (Get-Content VERSION -Raw).Trim()
          if ($current -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "Invalid VERSION: $current" }
          $major=[int]$Matches[1]; $minor=[int]$Matches[2]; $patch=[int]$Matches[3]
          switch ('${{ inputs.bump }}') {
            'major' { $major++; $minor=0; $patch=0 }
            'minor' { $minor++; $patch=0 }
            'patch' { $patch++ }
          }
          $next="$major.$minor.$patch"; $tag="v$next"
          git fetch --tags origin
          $existingTag = git tag --list $tag
          if ($existingTag -eq $tag) { throw "Tag $tag already exists" }
          & .\scripts\set-version.ps1 -Version $next
          if ($LASTEXITCODE -ne 0) { throw "Version synchronization failed" }
          "version=$next" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run Python tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem "tests" -Filter "*_test.py" | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "==> $($test.Name)"
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Python test failed: $($test.Name)" }
          }

      - name: Verify repository D2RLCompiler
        shell: pwsh
        run: |
          $compiler = Join-Path $PWD "external\D2RLCompiler\D2RLCompiler.exe"
          if (-not (Test-Path $compiler)) {
            throw "Repository-pinned D2RLCompiler.exe is missing at $compiler"
          }
          $sumLine = (Get-Content "external\D2RLCompiler\SHA256SUMS.txt" | Select-Object -First 1).Trim()
          if ($sumLine -notmatch '^([0-9A-Fa-f]{64})\s+D2RLCompiler\.exe
      - name: Configure
        shell: pwsh
        run: |
          $compiler = Join-Path $PWD "external\D2RLCompiler\D2RLCompiler.exe"
          cmake -S . -B build -DBUFF_PANEL_BUILD_TESTS=ON "-DD2RL_COMPILER=$compiler"

      - name: Pack companion MPQ
        shell: pwsh
        run: |
          cmake --build build --config Release --target buff_panel_companion
          $mpq = "build\stage\Release\d2rloader\plugins\d2rl-buff-panel.mpq"
          if (-not (Test-Path $mpq)) { throw "d2rl-buff-panel.mpq was not produced at $mpq" }

      - name: Verify companion MPQ
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check mpyq==0.2.5
          python tests/verify_package.py "build\stage\Release\d2rloader\plugins\d2rl-buff-panel.mpq"

      - name: Build DLL
        shell: pwsh
        run: |
          cmake --build build --config Release --target buff_panel --parallel
          $dll = "build\stage\Release\d2rloader\plugins\d2rl-buff-panel.dll"
          if (-not (Test-Path $dll)) { throw "d2rl-buff-panel.dll was not produced at $dll" }

      - name: Build regression tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run C++ tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Commit and tag
        shell: pwsh
        run: |
          $tag='${{ steps.version.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CMakeLists.txt src/plugin.cpp src/plugin.rc src/systems/buff_hud/buff_hud.cpp src/systems/buff_tracker/buff_tracker.cpp
          git commit -m "chore(release): $tag"
          git tag -a $tag -m "Buff HUD $tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version='${{ steps.version.outputs.version }}'
          $pluginDir = "build\stage\Release\d2rloader\plugins"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$pluginDir\d2rl-buff-panel.dll" "dist\d2rl-buff-panel.dll"
          Copy-Item "$pluginDir\d2rl-buff-panel.mpq" "dist\d2rl-buff-panel.mpq"
          git archive --format=zip --prefix="d2rl-buff-hud-$version/" -o "dist\d2rl-buff-hud-$version-source.zip" HEAD
          $names=@(
            "d2rl-buff-panel.dll",
            "d2rl-buff-panel.mpq",
            "d2rl-buff-hud-$version-source.zip"
          )
          $lines=foreach($name in $names){
            $h=(Get-FileHash (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $name"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD "dist\SHA256SUMS.txt"),$lines,[Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version='${{ steps.version.outputs.version }}'
          $tag='${{ steps.version.outputs.tag }}'
          gh release create $tag `
            "dist\d2rl-buff-panel.dll" `
            "dist\d2rl-buff-panel.mpq" `
            "dist\d2rl-buff-hud-$version-source.zip" `
            "dist\SHA256SUMS.txt" `
            --verify-tag `
            --title "Buff HUD $tag" `
            --generate-notes

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: buff-hud-release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
) {
            throw "Invalid external/D2RLCompiler/SHA256SUMS.txt"
          }
          $expected = $Matches[1].ToLowerInvariant()
          $actual = (Get-FileHash $compiler -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Repository D2RLCompiler SHA-256 mismatch: expected $expected, got $actual"
          }

      - name: Configure
        shell: pwsh
        run: |
          $compiler = Join-Path $PWD "external\D2RLCompiler\D2RLCompiler.exe"
          cmake -S . -B build -DBUFF_PANEL_BUILD_TESTS=ON "-DD2RL_COMPILER=$compiler"

      - name: Pack companion MPQ
        shell: pwsh
        run: |
          cmake --build build --config Release --target buff_panel_companion
          $mpq = "build\stage\Release\d2rloader\plugins\d2rl-buff-panel.mpq"
          if (-not (Test-Path $mpq)) { throw "d2rl-buff-panel.mpq was not produced at $mpq" }

      - name: Verify companion MPQ
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check mpyq==0.2.5
          python tests/verify_package.py "build\stage\Release\d2rloader\plugins\d2rl-buff-panel.mpq"

      - name: Build DLL
        shell: pwsh
        run: |
          cmake --build build --config Release --target buff_panel --parallel
          $dll = "build\stage\Release\d2rloader\plugins\d2rl-buff-panel.dll"
          if (-not (Test-Path $dll)) { throw "d2rl-buff-panel.dll was not produced at $dll" }

      - name: Build regression tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run C++ tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Commit and tag
        shell: pwsh
        run: |
          $tag='${{ steps.version.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CMakeLists.txt src/plugin.cpp src/plugin.rc src/systems/buff_hud/buff_hud.cpp src/systems/buff_tracker/buff_tracker.cpp
          git commit -m "chore(release): $tag"
          git tag -a $tag -m "Buff HUD $tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version='${{ steps.version.outputs.version }}'
          $pluginDir = "build\stage\Release\d2rloader\plugins"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$pluginDir\d2rl-buff-panel.dll" "dist\d2rl-buff-panel.dll"
          Copy-Item "$pluginDir\d2rl-buff-panel.mpq" "dist\d2rl-buff-panel.mpq"
          git archive --format=zip --prefix="d2rl-buff-hud-$version/" -o "dist\d2rl-buff-hud-$version-source.zip" HEAD
          $names=@(
            "d2rl-buff-panel.dll",
            "d2rl-buff-panel.mpq",
            "d2rl-buff-hud-$version-source.zip"
          )
          $lines=foreach($name in $names){
            $h=(Get-FileHash (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $name"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD "dist\SHA256SUMS.txt"),$lines,[Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version='${{ steps.version.outputs.version }}'
          $tag='${{ steps.version.outputs.tag }}'
          gh release create $tag `
            "dist\d2rl-buff-panel.dll" `
            "dist\d2rl-buff-panel.mpq" `
            "dist\d2rl-buff-hud-$version-source.zip" `
            "dist\SHA256SUMS.txt" `
            --verify-tag `
            --title "Buff HUD $tag" `
            --generate-notes

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: buff-hud-release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
